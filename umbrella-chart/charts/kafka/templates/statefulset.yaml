apiVersion:
  apps/v1 kind: StatefulSet
  metadata:
      name: { { include "kafka.fullname" . } }
      labels:
         app.kubernetes.io/name: { { include "kafka.name" . } }
         helm.sh/chart: { { include "kafka.chart" . } }
         app.kubernetes.io/instance: { { .Release.Name } }
         app.kubernetes.io/managed-by: { { .Release.Service } }
         spec:
          serviceName: { { include "kafka.fullname" . } }
          replicas: { { .Values.replicas } }
          selector:
             matchLabels:
               app.kubernetes.io/name: { { include "kafka.name" . } }
               app.kubernetes.io/instance: { { .Release.Name } }
          template:
            metadata:
              labels:
                app.kubernetes.io/name: { { include "kafka.name" . } }
                app.kubernetes.io/instance: { { .Release.Name } }
            spec:
               containers:
                 - name: kafka
                   image: "confluentinc/cp-server:7.3.3"
                   ports:
                     - containerPort: 9092
                   resources:
                     requests:
                       memory: "1Gi"
                       cpu: "1"
                   limits:
                    memory: "2Gi"
                    cpu: "2"
                   env:
                   - name: KAFKA_NODE_ID
                     value: '{{ index .Values.nodes .Ordinal }}'
                   - name: KAFKA_PROCESS_ROLES
                     value: controller,broker
                   - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                     value: | 
                        {% range $index, $node := .Values.nodes %} 
                            {{ add $index 1 }}=localhost:{{ add ($index | mul 10000) 23341}} 
                        {% end %}
                   - name: KAFKA_CLUSTER_ID
                     value: "{{ .Values.clusterID }}"
                   - name: KAFKA_LOG_MESSAGE_FORMAT_VERSION
                     value: "3.3-IV1"
                   - name: KAFKA_INTER_BROKER_PROTOCOL_VERSION
                     value: "3.3"
                   - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
                     value: "false"
                   - name: KAFKA_DEFAULT_REPLICATION_FACTOR
                     value: "{{ .Values.defaultReplicationFactor }}"
                   - name: KAFKA_MIN_INSYNC_REPLICAS
                     value: "{{ .Values.minInSyncReplicas }}"
                   - name: KAFKA_DELETE_TOPIC_ENABLE
                     value: "true"
                   - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
                     value: "0"
               volumeMounts:
                - mountPath: "/var/lib/kafka/data"
                  name: data
      volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: standard
          resources:
            requests:
              storage: 10Gi