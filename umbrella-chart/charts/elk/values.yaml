global:
  nameOverride: ""
  fullnameOverride: ""

elasticsearch:
  replicaCount: 1
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: 7.17.8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9200
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    storageClass: standard
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  env:
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"

logstash:
  replicaCount: 1
  image:
    repository: docker.elastic.co/logstash/logstash
    tag: 7.17.8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5044
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"

kibana:
  replicaCount: 1
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: 7.17.8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5601
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"

securityContext:
  runAsUser: 1000
  fsGroup: 1000

networkPolicy:
  enabled: false

extraAnnotations: {}
extraLabels: {}

secrets:
  elasticsearch-password: strongPasswordHere

replicas: 1

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    config.reload.automatic: true
    config.reload.interval: "10s"
    pipeline.workers: 3
    config.reload.automatic: true
    log.level: info 

logstashPipeline:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter {
      grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
      }
    }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "logs-%{+YYYY.MM.dd}"
      }
    }

podAnnotations:
  app: logstash

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "500m"