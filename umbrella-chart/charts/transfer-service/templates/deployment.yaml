apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-service.fullname" . }}-deployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        spec:
          containers:
            - name: {{ .Chart.Name }}-container
              image: {{ .Values.image.repository }}
              ports:
                - containerPort: 8083