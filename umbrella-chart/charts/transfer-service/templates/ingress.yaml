apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Char.Name }}-ingress
  namespace: default
spec:
  rules:
    - http:
        paths:
          - path: /transfers/**
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 8083