apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-service.fullname" . }}-deployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        spec:
          containers:
            - name: {{ .Chart.Name }}-container
              image: {{ .Values.image.repository }}
              ports:
                - containerPort: 8084
              env:
                - name: BOOTSTRAP_SERVERS
                  mountPath: { { .Values.global.consumerConfig.bootstrap.servers } }
                - name: GROUP_ID
                  mountPath: { { .Values.global.consumerConfig.group.id } }
                - name: AUTO_OFFSET_RESET
                  mountPath: { { .Values.global.consumerConfig.auto.offset.reset } }