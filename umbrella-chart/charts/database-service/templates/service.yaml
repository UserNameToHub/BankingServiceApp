{{- range $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-database-server
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
    - protocol: TCP
      port: {{ $service.port }}
      targetPort: {{ $service.port }}
{{- end }} # Range на перспективу