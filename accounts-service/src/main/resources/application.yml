spring:
  application:
    name: accounts-service

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/accounts_db
#    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: user
    password: user

  liquibase:
    change-log: classpath:/db/changelog/scripts/db.changelog-master.xml

server:
  port: 8081