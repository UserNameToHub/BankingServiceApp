spring:
  application:
    name: accounts-service

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    zookeeper:
      connect-string: localhost:2181
      discovery:
        enabled: true
      config:
        enabled: true

  oauth2:
    resourceserver:
      jwt:
        issuer-uri: http://localhost:8080/realms/bank-realm

    client:
      registration:
        transfer-service:
          provider: keycloak
          client-id: transfer-service
          client-secret: transfer-service-secret
          authorization-grant-type: client_credentials
      provider:
        keycloak:
          issuer-uri: http://localhost:8080/realms/bank-realm

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/accounts_db
#    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: user
    password: user

  liquibase:
    change-log: classpath:/db/changelog/scripts/db.changelog-master.xml

server:
  port: 8081