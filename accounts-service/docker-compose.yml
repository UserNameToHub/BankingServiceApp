services:
  postgresql-accounts:
#    image: postgres:latest
    image: postgres:14-alpine
    ports:
      - "5434:5434"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=accounts_db
    volumes:
      - postgres_data:/var/lib/postgresql-accounts/data

volumes:
  postgres_data: